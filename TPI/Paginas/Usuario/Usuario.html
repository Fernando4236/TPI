<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Usuario.css">
    <link rel="icon" href="../../assets/ico/Empresa1.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center;">
            <img src="../../assets/ico/Empresa1.ico" class="Empresa1" alt="Logo">
            <a href="../../Index.html">
            <h1 class="Titulo"><b>Todo<span class="logo">Play</span></b></h1>
            </a>
        </div>
        
        <div class="Interaccion">
            <p>Explorar</p>
            <a href="../Peliculas.html">Peliculas</a>
            <a href="../Series.html">Series</a>
            <p>Generos</p>
            <div style="display: flex; align-items: center;">
                <a href="Usuario.html">Usuario</a>
                <img src="../../assets/ico/Empresa1.jpeg" class="Usuario" alt="Usuario">
            </div>
        </div>
        
    </header>
    

    <main>
  <!-- Si o si se va a registrar -->
  <div class="form-card" id="seccionRegistro">
    <div class="card-header">
      <h2>Crear Cuenta</h2>
      <!--Agregar un parrafo bonito-->
      <p>Unete a TodoPlay para disfrutar de tus películas y series</p>
    </div>

    <form id="formRegistro" novalidate>
      <div class="row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej: Juan" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Ej: Perez" required>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="username">Nombre de usuario</label>
          <input type="text" id="username" placeholder="juanperez" required>
        </div>
        <div class="form-group">
          <label for="fecha_nac">Fecha de nacimiento</label>
          <input type="date" id="fecha_nac" required>
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo electronico</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="minimo 1 caracter" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirmar contraseña</label>
          <input type="password" id="confirm_password" placeholder="Repite tu contraseña" required>
        </div>
      </div>

      <div class="form-group">
        <label for="genero_fav">Genero favorito</label>
        <select id="genero_fav" required>
          <option value="" disabled selected>Selecciona tu genero preferido</option>
          <option value="Accion">Accion</option>
          <option value="Aventura">Aventura</option>
          <option value="Terror">Terror</option>
          <option value="Suspenso">Suspenso</option>
          
          
        </select>
      </div>

      <label class="checkbox-container">
        <input type="checkbox" id="terminos" required>
        <span>Acepto los <a href="#">terminos y condiciones</a></span>
      </label>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>
  </div>

  <!-- 2. Tarjeta de Perfil de Usuario (Se muestra si ya está registrado) -->
  <div class="form-card" id="seccionPerfil" style="display: none;">
    <div class="card-header">
      <h2>Perfil Bonito, como el usuario que se registro💗</h2>
      <p>Bienvenido a tu cuenta de TodoPlay</p>
    </div>

    <!--que quede blanco: write para que resalte-->
    <div class="perfil-datos">
      <p><strong>Nombre:</strong> <span id="perfilNombreCompleto"></span></p>
      <p><strong>Usuario:</strong> @<span id="perfilUsername"></span></p>
      <p><strong>Correo:</strong> <span id="perfilCorreo"></span></p>
      <p><strong>Genero favorito:</strong> <span id="perfilGenero"></span></p>
    </div>

    <button type="button" id="btnCerrarSesion" class="btn-logout">Cerrar Sesion / Eliminar Cuenta</button>
  </div>
</main>


<script src="script.js"></script>
</body>
</html>
